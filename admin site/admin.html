<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17312d">
    <title>Admin Sign In | Quiz Portal</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <main class="auth-wrapper">
        <section class="auth-card" aria-labelledby="adminHeading">
            <header class="auth-header">
                <div class="logo-badge" aria-hidden="true">Q</div>
                <h2 id="adminHeading">Administrator sign in</h2>
                <p>Manage learning content and student results</p>
            </header>
            <div class="auth-body">
                <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                    <div class="form-group">
                        <label class="form-label" for="email">Work email</label>
                        <div class="input-with-icon">
                            <span class="input-icon" aria-hidden="true">@</span>
                            <input class="form-control" type="email" id="email" autocomplete="username" placeholder="name@organization.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-with-icon">
                            <span class="input-icon" aria-hidden="true">&#8226;</span>
                            <input class="form-control" type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required>
                            <button class="toggle-password" type="button" aria-label="Show password" onclick="togglePasswordVisibility()">Show</button>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="loginBtn" type="submit" style="width:100%; margin-top:8px;">Sign in to admin</button>
                </form>
                <div class="auth-divider"><span>or</span></div>
                <button class="btn btn-google" id="googleLoginBtn" type="button" style="width:100%;" onclick="handleAdminGoogleSignIn()">
                    <span class="google-mark" aria-hidden="true">G</span> Continue with Google
                </button>
                <p style="margin-top:20px; text-align:center; color:var(--text-muted); font-size:12px;">Administrator access is limited to approved accounts.</p>
                <p style="margin-top:14px; text-align:center; font-size:13px;"><a href="../index.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Return to portal selection</a></p>
            </div>
        </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
