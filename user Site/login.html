<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Quiz Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card-student">
            <div class="auth-hero">
                <div class="logo">🎓</div>
                <h2>Student Portal</h2>
                <p>Sign in to access your quizzes, ID card, and test results</p>
            </div>

            <div class="auth-content">
                <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
                    <div class="form-group">
                        <label class="form-label" for="email">Student Email</label>
                        <div class="input-with-icon">
                            <span class="input-icon">✉️</span>
                            <input type="email" class="form-control" id="email" placeholder="student@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-with-icon">
                            <span class="input-icon">🔒</span>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-pw" onclick="togglePasswordVisibility()">👁️</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="margin-top: 10px;">
                        <span>Sign In</span>
                    </button>
                </form>

                <div class="auth-divider"><span>or</span></div>
                <button type="button" class="btn btn-google btn-block" id="googleLoginBtn" onclick="handleStudentGoogleSignIn()">
                    <span class="google-mark" aria-hidden="true">G</span> Continue with Google
                </button>

                <div class="auth-footer-link">
                    Don't have an account? <a href="signup.html">Register as Student</a>
                </div>

                <div style="margin-top: 20px; padding: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; text-align: center;">
                    <span style="font-size: 12px; color: #64748b;">Need quick access?</span><br>
                    <a href="../admin site/admin.html" style="font-size: 13px; color: #4f46e5; font-weight: 600; text-decoration: none;">Go to Admin Portal →</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- App Scripts -->
    <script src="firebase-config.js"></script>
    <script src="login.js"></script>

</body>
</html>
